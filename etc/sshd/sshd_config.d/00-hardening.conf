# Loaded before sshd_config.d/9999999gentoo-*.conf; no option here collides
# with those, so ordering is fine. Applies at next sshd start.
# Purpose: shed brute-force scan noise without any impact on legit use
# (key-only auth is already enforced, so these cannot lock anyone out).

# Abort a connection after 3 auth failures and give only 30s to authenticate.
MaxAuthTries 3
LoginGraceTime 30

# Don't do reverse-DNS lookups; they stall connections under scan load.
UseDNS no

# Drop dead/unresponsive sessions (client no longer reachable): interval of
# 5 min, allow 3 missed keepalives (~15 min) before closing.
ClientAliveInterval 300
ClientAliveCountMax 3

# Only known interactive user may log in; root stays key-only and has no keys.
AllowUsers jcomcl
